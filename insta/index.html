<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instagram</title>
  <link rel="stylesheet" href="style.css" />
  
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="app">

    <!-- HEADER -->
    <header class="top-bar">
      <div class="logo">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Instagram_logo.svg/2560px-Instagram_logo.svg.png" alt="Instagram">
      </div>
      <div class="top-icons">
        <i class="fa-regular fa-heart"></i>
        <i class="fa-brands fa-facebook-messenger"></i>
      </div>
    </header>

    <!-- Stories -->
    <div class="stories">
      <div class="story">
        <img src="image/roopa1.jpg" alt="your story">
        <p>Your story</p>
      </div>
      <div class="story">
        <img src="image/ito.jpg" alt="story">
        <p>ice_thilo</p>
      </div>
      <div class="story">
        <img src="image/sahana.jpg" alt="story">
        <p>_saha_papz_</p>
      </div>
      <div class="story">
        <img src="image/sakthi.jpg" alt="story">
        <p>itz_me_sakthi</p>
      </div>
    </div>

    <!-- Post -->
    <div class="post">
      <div class="post-header">
        <div class="profile">
          <img src="image/polimer logo.png" alt="profile">
          <div>
            <h4>polimernews <i class="fa-solid fa-circle-check"></i></h4>
            <span>Polimer News</span>
          </div>
        </div>
        <i class="fa-solid fa-ellipsis-vertical"></i>
      </div>

      <!-- Post Image -->
      <img src="image/postinsta.jpg" alt="post image" class="post-img">

      <!-- Post Actions -->
      <div class="post-actions">
        <div class="left">
          <i class="fa-regular fa-heart"></i>
          <i class="fa-regular fa-comment"></i>
          <i class="fa-regular fa-paper-plane"></i>
        </div>
        <div class="right">
          <i class="fa-regular fa-bookmark"></i>
        </div>
      </div>

      <!-- Likes & Caption -->
      <div class="post-info">
        <p class="likes">625 likes</p>
        <p class="caption"><strong>polimernews</strong> This is a state government news.</p>
        <p class="comments">View all 13 comments</p>
        <p class="time">5 August 2025</p>
      </div>
    </div>

     <!-- Bottom Nav -->
    <nav class="bottom-nav">
      <i class="fa-solid fa-house"></i>
      <i class="fa-solid fa-magnifying-glass"></i>
      <i class="fa-regular fa-square-plus"></i>
      <i class="fa-regular fa-heart"></i>
      
    <!-- Profile image instead of user icon -->
      <div class="bottom-profile">
        <img src="image/roopa1.jpg" alt="profile">
      </div>
    </nav>

  </div>
</body>
</html>
